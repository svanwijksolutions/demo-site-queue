<!DOCTYPE html><html lang="en" class="scroll-smooth"><head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Carzap - Professional Car Detailing</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&amp;family=Inter+Tight:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
  </style>
<style type="text/tailwindcss">@import "tailwindcss";</style><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config = {
  theme: {
    extend: {
      colors: {
        'brand-primary': '#dc2626',
        'brand-secondary': '#b91c1c',
        'neutral-background': '#000000',
        'neutral-surface': '#18181b',
        'neutral-surface-alt': '#09090b',
      },
      fontFamily: {
        'primary': ['Bricolage Grotesque', 'sans-serif'],
        'secondary': ['Inter Tight', 'sans-serif'],
      },
      boxShadow: {
        'cta': '0 4px 15px rgba(220, 38, 38, 0.3)',
      }
    }
  }
}</script></head>

<body class="font-secondary bg-neutral-background text-white overflow-x-hidden antialiased">

  <nav class="fixed top-0 w-full z-50 border-b border-white/10 backdrop-blur-sm bg-black/20 transition-all duration-300" id="navbar">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <div class="flex-shrink-0 flex items-center gap-2">
          <a href="#" class="text-2xl font-serif italic font-bold text-white hover:text-brand-primary transition-colors">Carzap</a>
        </div>
        <div class="hidden md:block">
          <div class="ml-10 flex items-baseline space-x-8">
            <a href="#services" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Services</a>
            <a href="#gallery" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Gallery</a>
            <a href="#pricing" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Pricing</a>
          </div>
        </div>
        <div class="hidden md:block">
          <button class="bg-brand-primary hover:bg-brand-secondary text-white px-6 py-2.5 rounded text-sm font-medium transition-colors duration-200 shadow-cta">
            Book now
          </button>
        </div>
        <div class="-mr-2 flex md:hidden">
          <button id="mobile-menu-btn" class="text-gray-400 hover:text-white p-2 focus:outline-none">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-neutral-surface border-b border-neutral-border shadow-2xl absolute w-full">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
        <a href="#services" class="text-gray-300 hover:text-white hover:bg-white/5 block px-3 py-2 rounded-md text-base font-medium">Services</a>
        <a href="#gallery" class="text-gray-300 hover:text-white hover:bg-white/5 block px-3 py-2 rounded-md text-base font-medium">Gallery</a>
      </div>
    </div>
  </nav>

  <main><section class="relative h-screen min-h-[700px] flex items-center justify-center overflow-hidden">
  <div class="absolute inset-0 z-0">
    <img src="https://images.unsplash.com/photo-1601362840469-51e4d8d58785?q=80&amp;w=2070&amp;auto=format&amp;fit=crop" alt="Car detailing" class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/50 to-transparent"></div>
  </div>
  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 w-full">
    <div class="max-w-2xl space-y-6">
      <h1 class="text-4xl md:text-6xl font-secondary font-bold leading-tight tracking-tight text-white">
        PROFESSIONAL CAR DETAILING THAT BRINGS YOUR VEHICLE TO LIFE
      </h1>
      <p class="text-lg text-gray-300 leading-relaxed max-w-lg">
        We transform your car with precision and care, delivering showroom-quality results.
      </p>
      <div class="flex flex-col sm:flex-row gap-4 pt-4">
        <button class="bg-brand-primary hover:bg-brand-secondary text-white px-8 py-3.5 rounded text-sm font-medium transition-colors duration-200 shadow-cta">
          Book now
        </button>
      </div>
    </div>
  </div>
</section>

<!-- Prijstoggle maand/jaar met een schuivend achtergrondblokje -->
<section id="pricing" class="py-24 bg-neutral-surface-alt">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
     <div class="flex justify-center mb-12">
       <div class="bg-neutral-surface p-1 rounded-full border border-neutral-border inline-flex relative">
          <div id="price-toggle-bg" class="absolute top-1 bottom-1 w-[86px] bg-white rounded-full transition-all duration-300 left-[92px]"></div>
          <button onclick="setBilling('monthly')" id="btn-monthly" class="relative z-10 px-6 py-2 rounded-full text-sm font-medium transition-colors text-gray-400 hover:text-white w-[90px]">Monthly</button>
          <button onclick="setBilling('yearly')" id="btn-yearly" class="relative z-10 px-6 py-2 rounded-full text-sm font-medium transition-colors text-black w-[90px]">Yearly</button>
       </div>
     </div>
     <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
       <div class="p-8 rounded-lg bg-neutral-surface border border-neutral-border text-white">
         <div class="mb-8"><h3 class="font-bold text-lg mb-2">Basic detail</h3></div>
         <div class="mb-8">
           <div class="flex items-baseline">
             <span class="text-4xl font-bold price-val" data-monthly="99" data-yearly="990">$990</span>
             <span class="text-sm text-gray-400 price-period">/yr</span>
           </div>
         </div>
         <button class="w-full mb-8 border border-white/20 hover:bg-white hover:text-black text-white py-3 rounded text-sm font-medium transition-colors">Book now</button>
       </div>
       <div class="p-8 rounded-lg bg-white text-black shadow-xl scale-105 z-10">
         <div class="mb-8"><h3 class="font-bold text-lg mb-2">Business detail</h3></div>
         <div class="mb-8">
           <div class="flex items-baseline">
             <span class="text-4xl font-bold price-val" data-monthly="199" data-yearly="1990">$1990</span>
             <span class="text-sm text-gray-500 price-period">/yr</span>
           </div>
         </div>
         <button class="w-full mb-8 bg-brand-primary hover:bg-brand-secondary text-white py-3 rounded text-sm font-medium transition-colors shadow-cta">Book annual business</button>
       </div>
       <div class="p-8 rounded-lg bg-neutral-surface border border-neutral-border text-white">
         <div class="mb-8"><h3 class="font-bold text-lg mb-2">Enterprise detail</h3></div>
         <div class="mb-8">
           <div class="flex items-baseline">
             <span class="text-4xl font-bold price-val" data-monthly="299" data-yearly="2990">$2990</span>
             <span class="text-sm text-gray-400 price-period">/yr</span>
           </div>
         </div>
         <button class="w-full mb-8 border border-white/20 hover:bg-white hover:text-black text-white py-3 rounded text-sm font-medium transition-colors">Book now</button>
       </div>
     </div>
  </div>
</section>

<script>
  function setBilling(cycle) {
    const bg = document.getElementById('price-toggle-bg');
    const btnMonthly = document.getElementById('btn-monthly');
    const btnYearly = document.getElementById('btn-yearly');
    const prices = document.querySelectorAll('.price-val');
    const periods = document.querySelectorAll('.price-period');

    if (cycle === 'monthly') {
      bg.classList.remove('left-[92px]'); bg.classList.add('left-1');
      btnMonthly.classList.remove('text-gray-400', 'hover:text-white'); btnMonthly.classList.add('text-black');
      btnYearly.classList.add('text-gray-400', 'hover:text-white'); btnYearly.classList.remove('text-black');
      prices.forEach(p => p.textContent = '$' + p.dataset.monthly);
      periods.forEach(p => p.textContent = '/mo');
    } else {
      bg.classList.add('left-[92px]'); bg.classList.remove('left-1');
      btnYearly.classList.remove('text-gray-400', 'hover:text-white'); btnYearly.classList.add('text-black');
      btnMonthly.classList.add('text-gray-400', 'hover:text-white'); btnMonthly.classList.remove('text-black');
      prices.forEach(p => p.textContent = '$' + p.dataset.yearly);
      periods.forEach(p => p.textContent = '/yr');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');
    if (btn && menu) {
      btn.addEventListener('click', () => { menu.classList.toggle('hidden'); });
    }
    const nav = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        nav.classList.add('bg-black/90', 'shadow-lg');
        nav.classList.remove('bg-black/20');
      } else {
        nav.classList.remove('bg-black/90', 'shadow-lg');
        nav.classList.add('bg-black/20');
      }
    });
  });
</script></main>
</body></html>
