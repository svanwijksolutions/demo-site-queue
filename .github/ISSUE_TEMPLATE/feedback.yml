name: "Feedback op een live demo-site"
description: "Geef feedback op een bestaande demo-website, wordt 's nachts verwerkt."
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: input
    id: site
    attributes:
      label: "Welke site"
      description: "De repo-naam (bijv. ziehaarstralen-demo, vanoostenvoorvis, manimania) of gewoon de bedrijfsnaam."
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: "Feedback"
      description: "Eén punt per regel is het makkelijkst te verwerken, maar hoeft niet per se. Geldt een punt voor alle sites (nu en in de toekomst)? Zeg dat er dan gewoon bij, dan komt het in de vaste regels terecht."
      placeholder: |
        - Het logo mag groter in de header
        - De foto op de contactpagina is onscherp
        - Dit moet voortaan voor alle sites gelden: ...
    validations:
      required: true
