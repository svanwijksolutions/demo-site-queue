name: "Nieuw bedrijf voor de demo-site pipeline"
description: "Vul dit in om een nieuw bedrijf in de wachtrij te zetten voor een ongevraagde demo-website."
title: "[Nieuw bedrijf] "
labels: ["nieuw-bedrijf"]
body:
  - type: markdown
    attributes:
      value: |
        Vul hieronder de `id`, bedrijfsnaam en daarna gewoon vrije tekst in met alles wat je over het bedrijf weet. De pipeline haalt hier zelf de losse velden uit (branche, diensten, contactgegevens, etc.), dus je hoeft niets in een vast format te zetten.

        **Foto's aanleveren (los van dit formulier, bijlagen in issues zijn niet betrouwbaar op te halen):** ga naar de repo [`demo-site-queue`](https://github.com/svanwijksolutions/demo-site-queue), open de map `uploads/`, maak een nieuwe map aan met dezelfde `id` die je hieronder invult (bijv. `uploads/bakkerij-devries/`), en upload je foto's daar via "Add file" → "Upload files". Wil je per foto aangeven waar die op de site moet komen (bijv. hero, over-ons, een specifieke dienst)? Maak in diezelfde map een tekstbestandje `notities.txt` aan en zet er per foto een regel in, bijv. `IMG_001.jpg - grote foto voor de hero` of `logo.png - logo voor in de header`. Vrije vorm, ik lees het zelf.
  - type: input
    id: id
    attributes:
      label: "Id (korte slug, geen spaties/hoofdletters)"
      description: "Wordt gebruikt als repo-naam-basis en als mapnaam voor foto's, bijv. bakkerij-devries"
      placeholder: "bakkerij-devries"
    validations:
      required: true
  - type: input
    id: bedrijfsnaam
    attributes:
      label: "Bedrijfsnaam"
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: "Alle bedrijfsinformatie (vrije tekst)"
      description: "Typ hier gewoon alles wat je weet: branche, diensten/producten, contactpersoon, adres, telefoon, e-mail, KVK, huidige website, regio, reviews (alleen als je ze echt hebt), gewenste sfeer/kleuren, en al het overige. Geen vast format nodig, ik haal er zelf de losse velden uit. Verzin niets dat je niet zeker weet, laat het dan gewoon weg."
      placeholder: |
        Bakkerij De Vries, bakkerij in Delft. Contactpersoon: Jan de Vries, adres Marktstraat 12, 2611 AB Delft, tel 015-1234567, info@bakkerijdevries.nl. Geen KVK bekend. Huidige site: bakkerijdevries.nl. Werkgebied: Delft en omgeving.
        Diensten: vers brood, taarten op bestelling, belegde broodjes, catering.
        Reviews: geen bekend.
        Sfeer: warm, ambachtelijk, houtlook, geen strak/koud design.
    validations:
      required: true
  - type: input
    id: talen
    attributes:
      label: "Talen (komma-gescheiden, bijv. nl of nl,en)"
      placeholder: "nl"
    validations:
      required: false
  - type: checkboxes
    id: repo_status
    attributes:
      label: "Repo-status"
      options:
        - label: "Ik heb de lege GitHub-repo `<id>-demo` al aangemaakt (publiek, leeg)"
          required: false
